chatgpt_neu="Analysiere das beigefügte Foto und erfasse alle erkennbaren Gegenstände. Erfinde keine Details, analysiere nur vollständig sichtbare Gegenstände, also keine, bei denen z.B: das Anschlusskabel nicht vollständig sichtbar ist; kennzeichne unsichere Erkennungen.

Erstelle folgende Informationen:
- device: Eine kurze, aussagekräftige Gesamtbezeichnung der abgebildeten Gegenstände.
- category: Verwende eine gemeinsame, passende Kategorie, sofern vorhanden. Gibt es keine sinnvolle gemeinsame Kategorie, verwende eine durch Beistriche getrennte Liste aller zutreffenden Kategorien, ohne Duplikate.
- description: Liste die Gegenstände auf, jeweils einen pro Zeile mit „- “ als Aufzählungszeichen. Nenne nach Möglichkeit Anzahl, Gegenstandsbezeichnung und sichtbare Merkmale. Vereinfache die Merkmale auf das Wesentliche, lass unnötige Merkmale komplett weg. Erhalte echte Zeilenvorschübe.
- box: Immer exakt „xxx“.

Speichere das Foto als JPG und bette die Informationen in folgende XMP-Felder ein:
- chaosbox:device = device
- chaosbox:category = category
- dc:description = description
- chaosbox:box = xxx

Verwende diese XML-Namensräume:
- chaosbox: urn:chaosbox:metadata:1.0/
- dc: http://purl.org/dc/elements/1.1/
- rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#

Speichere dc:description als rdf:Alt mit einem rdf:li mit xml:lang="x-default". Bewahre die tatsächlichen Zeilenvorschübe im Text; verwende keine wörtlichen „\n“-Zeichenfolgen.

Die fertige JPG-Datei darf einschließlich aller XMP-Metadaten höchstens 30.000 Bytes groß sein. Reduziere dafür schrittweise JPEG-Qualität und bei Bedarf die Bildauflösung, behalte das Seitenverhältnis bei und entferne unnötige Metadaten. Erhalte die oben genannten XMP-Felder vollständig.

Prüfe abschließend:
1. Die Datei ist ein gültiges JPEG.
2. Die Dateigröße beträgt höchstens 30.000 Bytes.
3. Alle vier XMP-Felder lassen sich korrekt auslesen.
4. Die Gegenstandsliste enthält nach dem Auslesen weiterhin echte Zeilenvorschübe.

Gib die fertige JPG-Datei als Download aus und zeige die erfassten Feldinhalte sowie die endgültige Dateigröße an. Falls du keine Dateien bearbeiten oder XMP-Metadaten schreiben kannst, sage dies ausdrücklich."
